    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/list.css" />
  </head>
  <body>
    <div class="list">
      <header>
        <h1>{{name}}</h1>
        <p class="role">{{title}}</p>
        <p>{{blurb}}</p>
        <p><a class="btn" href="/">Enter the dungeon (interactive version)</a></p>
      </header>
      <main>
        {{list}}
      </main>
      <footer>
        <p>Pixel art is original and drawn in code, except the cave backdrop: "Cavernous" by Spring Spring (CC0, opengameart.org). Fonts: Press Start 2P and VT323 (Google Fonts, OFL).</p>
