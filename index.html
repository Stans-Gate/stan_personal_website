<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{name}} · {{title}}</title>
    <meta name="description" content="{{blurb}}" />
    <meta name="theme-color" content="#080c13" />
    <link rel="canonical" href="{{url}}/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{name}} · {{title}}" />
    <meta property="og:description" content="A playable pixel-art dungeon portfolio. Walk the hall of hanging flasks to explore projects and experience." />
    <meta property="og:url" content="{{url}}/" />
    <meta property="og:image" content="{{url}}/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%230b111c%22/%3E%3Crect x=%227%22 y=%220%22 width=%222%22 height=%223%22 fill=%22%2375828f%22/%3E%3Crect x=%226%22 y=%223%22 width=%224%22 height=%222%22 fill=%22%238a6a4a%22/%3E%3Crect x=%226%22 y=%225%22 width=%224%22 height=%222%22 fill=%22%23b9d0e2%22/%3E%3Crect x=%224%22 y=%227%22 width=%228%22 height=%227%22 fill=%22%233ee6d0%22/%3E%3Crect x=%223%22 y=%228%22 width=%2210%22 height=%225%22 fill=%22%233ee6d0%22/%3E%3Crect x=%225%22 y=%229%22 width=%222%22 height=%222%22 fill=%22%23eafffb%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <noscript><meta http-equiv="refresh" content="0; url=/list.html" /></noscript>
  </head>
  <body class="game">
    <h1 class="sr-only">{{name}}: {{title}}</h1>
    <p class="sr-only">
      {{blurb}} This page is a playable pixel-art room: each hanging flask holds one project or
      role, and the lectern holds contact links. Everything is also available in the list view.
    </p>

    <div id="hud"></div>
    <nav id="flask-nav" aria-label="Flasks and contact"></nav>
    <main id="stage">
      <canvas id="game" width="480" height="270" role="img" aria-label="A dim stone dungeon hall with glowing flasks hanging from chains"></canvas>
    </main>
    <div id="contacts" role="group" aria-label="Contact links" hidden></div>
    <div id="hint" aria-hidden="true"></div>
    <div id="touch"></div>
    <div id="panel-root"></div>

    <noscript>
      <div class="list">
        <p><a href="/list.html">Open the list view</a></p>
        {{list}}
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
